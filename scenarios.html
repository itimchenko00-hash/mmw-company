<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALADIN MMW-COMPANY — Сценарии участия</title>
<style>
:root{--bg:#0b0e0d;--card:#121715;--line:#27302c;--gold:#c9a96a;--text:#eef1ee;--muted:#9da8a3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a211e 0,#0b0e0d 55%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:70px 24px}.eyebrow{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px;margin-bottom:16px}.title{font-size:clamp(36px,6vw,68px);line-height:1;margin:0 0 18px}.lead{color:var(--muted);font-size:18px;margin:0 0 42px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{position:relative;min-height:240px;padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#151b18,#0f1312);text-decoration:none;color:inherit;transition:.25s;overflow:hidden}.card:hover{transform:translateY(-5px);border-color:var(--gold)}.num{position:absolute;right:24px;top:20px;color:#53605a;font-size:12px}.icon{font-size:38px;margin-bottom:30px}.name{font-size:25px;font-weight:700;margin-bottom:10px}.desc{color:var(--muted);font-size:16px}.footer{margin-top:42px;color:#69736e;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:45px 18px}.card{min-height:205px}}
</style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">ALADIN · MMW-COMPANY</div>
<h1 class="title">Выберите свой сценарий</h1>
<p class="lead">Один вход — четыре маршрута участия.</p>
<section class="grid">
<a class="card" href="#buyer"><span class="num">01</span><div class="icon">🏠</div><div class="name">Покупатель</div><div class="desc">Объект и конфигурация</div></a>
<a class="card" href="#investor"><span class="num">02</span><div class="icon">💰</div><div class="name">Инвестор</div><div class="desc">Капитал и сценарий</div></a>
<a class="card" href="#land"><span class="num">03</span><div class="icon">🌍</div><div class="name">Владелец земли</div><div class="desc">Участок и партнёрство</div></a>
<a class="card" href="#partner"><span class="num">04</span><div class="icon">🤝</div><div class="name">Партнёр</div><div class="desc">Компетенции и участие</div></a>
</section>
<div class="footer">Интерактивный модуль сценариев · ALADIN MMW-COMPANY</div>
</main>
</body>
</html>
